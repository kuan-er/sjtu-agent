[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-agent"
version = "0.11.2"
description = "Deployable SJTU campus agent with CLI, multi-platform bots (Feishu/Telegram/WeChat/QQ), and MCP server."
readme = "README.md"
requires-python = ">=3.11, <4.0"
dynamic = ["dependencies"]

[project.scripts]
sjtu-agent = "sjtu_agent.cli:main"

[tool.setuptools]
py-modules = [
  "agent",
  "ddl_checker",
  "login",
]

[tool.setuptools.packages.find]
include = ["sjtu_agent", "sjtu_agent.*"]

[tool.setuptools.package-data]
"sjtu_agent.web" = ["static/*"]
"sjtu_agent.data" = ["*.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
# 按需所取：语义记忆（跨会话语义检索）需要 chromadb
memory = ["chromadb>=0.5.0"]
